name: Build & Release QBrowse

on:
  push:
    branches: [ "main", "rust-edition" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "rust-edition" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-edition' || github.base_ref == 'main' || github.base_ref == 'rust-edition' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Sync version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VER" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build & Test Rust Core + Parity Suite
        shell: bash
        run: |
          npm run build:rust
          test -f electron/native/qbrowse-core.win32-x64-msvc.node
          cargo test --workspace --release --manifest-path rust/Cargo.toml
          node tests/verify_rust_parity.cjs

      - name: Build Windows Offline NSIS Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Build Custom Rust Web Installer
        shell: bash
        run: |
          npm run build:installer
          ls -la dist_electron/QBrowse-Web-Setup-*.exe
          for f in dist_electron/QBrowse-Web-Setup-*.exe; do
            "$f" --version
          done

      - name: Verify Windows Artifacts
        shell: bash
        run: |
          ls -la dist_electron
          test -f dist_electron/latest.yml
          ls dist_electron/QBrowse-Setup-*.exe
          ls dist_electron/QBrowse-Setup-*.exe.blockmap
          ls dist_electron/QBrowse-Web-Setup-*.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbrowse-windows
          path: |
            dist_electron/QBrowse-Setup-*.exe
            dist_electron/QBrowse-Web-Setup-*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml

  build-linux:
    name: Build Linux (x64)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-edition' || github.base_ref == 'main' || github.base_ref == 'rust-edition' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Sync version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VER" --no-git-tag-version --allow-same-version

      - name: Install system packaging & Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libarchive-tools rpm

      - name: Install dependencies
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          chmod +x node_modules/.bin/electron-builder || true

      - name: Build & Test Rust Core + Parity & Updater Suites
        run: |
          npm run build:rust
          test -f electron/native/qbrowse-core.linux-x64-gnu.node
          cargo test --workspace --release --manifest-path rust/Cargo.toml
          node test_linux_updater.cjs
          node tests/verify_rust_parity.cjs

      - name: Download Linux AI Binaries
        run: |
          mkdir -p electron/bin
          curl -L -o /tmp/llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b4528/llama-b4528-bin-ubuntu-x64.zip || true
          unzip -o /tmp/llama.zip -d electron/bin/ || true
          rm -f /tmp/llama.zip
          chmod +x electron/bin/* || true

      - name: Build Linux Packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify Linux Artifacts
        run: |
          ls -la dist_electron
          test -f dist_electron/latest-linux.yml
          ls dist_electron/*.AppImage dist_electron/*.deb dist_electron/*.rpm dist_electron/*.pacman dist_electron/*.tar.gz
          for f in dist_electron/*.AppImage dist_electron/*.deb dist_electron/*.rpm dist_electron/*.pacman dist_electron/*.tar.gz; do
            case "$(basename "$f")" in
              *" "*) echo "ERROR: Space found in Linux artifact name: $f" >&2; exit 1 ;;
            esac
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbrowse-linux
          path: |
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.AppImage
            dist_electron/*.pacman
            dist_electron/*.tar.gz
            dist_electron/*.blockmap
            dist_electron/latest-linux*.yml

  publish-release:
    name: Publish Unified Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Prepare Transition Metadata & Verify Artifacts
        run: |
          cd release-dist
          test -f latest.yml
          test -f latest-linux.yml
          # Transition bridge so v1.5.0 Rust Edition testers auto-update seamlessly onto v1.5.1+
          cp latest.yml rust.yml
          cp latest-linux.yml rust-linux.yml
          ls -la

      - name: Write Release Notes
        run: |
          cat <<'EOF' > release-notes.md
          ### QBrowse (Unified Rust-Powered Release)
          QBrowse is now unified on the high-performance Rust (`napi-rs`) core for faster startup, lower memory usage, native SQLite FTS5 history, native adblock/shield, QVault crypto, and zero-copy local streaming.

          ### Downloads
          - **Windows Web Installer (`QBrowse-Web-Setup-*.exe`)** — Tiny, fast custom Rust web installer that fetches and verifies the latest build.
          - **Windows Offline Installer (`QBrowse-Setup-*.exe`)** — Full offline NSIS installer (also used for WinGet & `.blockmap` delta auto-updates).
          - **Linux Packages** — `.AppImage` (with delta auto-updates), `.deb`, `.rpm`, `.pacman`, and `.tar.gz`.
          EOF

      - name: Publish all installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    name: Publish to WinGet
    needs: [publish-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Check WinGet Token
        id: check-token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "WINGET_TOKEN secret is not configured; skipping WinGet submission."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit WinGet Manifest Update
        if: steps.check-token.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: QuBI.QBrowse
          installers-regex: '^QBrowse-Setup-.*-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
