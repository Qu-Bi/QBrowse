name: Build & Release QBrowse (Windows & Linux)

on:
  push:
    branches: [ "main", "rust-edition" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "rust-edition" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Sync version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VER" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build & Test Rust Core + Parity Suite
        shell: bash
        run: |
          npm run build:rust
          test -f electron/native/qbrowse-core.win32-x64-msvc.node
          cargo test --workspace --release --manifest-path rust/Cargo.toml
          node tests/verify_rust_parity.cjs

      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbrowse-windows
          path: |
            dist_electron/*.exe
            dist_electron/*.blockmap
            dist_electron/latest.yml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Sync version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VER" --no-git-tag-version --allow-same-version

      - name: Install system packaging & Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libarchive-tools rpm

      - name: Install dependencies
        run: |
          npm install
          chmod +x node_modules/.bin/vite
          chmod +x node_modules/.bin/electron-builder || true

      - name: Build & Test Rust Core + Parity Suite
        run: |
          npm run build:rust
          test -f electron/native/qbrowse-core.linux-x64-gnu.node
          cargo test --workspace --release --manifest-path rust/Cargo.toml
          node test_linux_updater.cjs
          node tests/verify_rust_parity.cjs

      - name: Download Linux AI Binaries
        run: |
          mkdir -p electron/bin
          curl -L -o /tmp/llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b4528/llama-b4528-bin-ubuntu-x64.zip || true
          unzip -o /tmp/llama.zip -d electron/bin/ || true
          rm -f /tmp/llama.zip
          chmod +x electron/bin/* || true

      - name: Build Linux (AppImage, DEB, RPM, Pacman, Tar.gz)
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify Linux Artifacts & Auto-Update Metadata
        run: |
          ls -la dist_electron
          test -f dist_electron/latest-linux.yml
          ls dist_electron/*.AppImage dist_electron/*.deb dist_electron/*.rpm dist_electron/*.pacman dist_electron/*.tar.gz
          # Ensure no spaces exist in Linux artifact filenames (prevents shell & latest-linux.yml mismatches)
          for f in dist_electron/*.AppImage dist_electron/*.deb dist_electron/*.rpm dist_electron/*.pacman dist_electron/*.tar.gz; do
            case "$(basename "$f")" in
              *" "*) echo "ERROR: Space found in Linux artifact name: $f" >&2; exit 1 ;;
            esac
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qbrowse-linux
          path: |
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.AppImage
            dist_electron/*.pacman
            dist_electron/*.tar.gz
            dist_electron/*.blockmap
            dist_electron/latest-linux*.yml

  publish-release:
    name: Publish Release (All Platforms)
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Normalize Windows artifact filenames for latest.yml compatibility
        run: |
          cd release-dist
          for f in *Setup*.exe; do
            if [ -f "$f" ]; then
              HYPHEN_NAME=$(echo "$f" | sed -E 's/[ .]+Setup[ .]+/-Setup-/g')
              if [ "$f" != "$HYPHEN_NAME" ]; then
                cp "$f" "$HYPHEN_NAME"
              fi
            fi
          done

      - name: Publish all installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
