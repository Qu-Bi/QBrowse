name: Build Linux Releases

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install system packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libarchive-tools

    - name: Install dependencies
      run: |
        npm install
        chmod +x node_modules/.bin/vite
        chmod +x node_modules/.bin/electron-builder || true

    - name: Download Linux AI Binaries
      run: |
        mkdir -p electron/bin
        curl -L -o llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b4528/llama-b4528-bin-ubuntu-x64.zip || true
        unzip -o llama.zip -d electron/bin/ || true
        chmod +x electron/bin/* || true

    - name: Build Linux (DEB, AppImage, Pacman, Tar.gz)
      run: npm run build:linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QBrowse-Linux-Builds
        path: |
          dist_electron/*.deb
          dist_electron/*.AppImage
          dist_electron/*.pacman
          dist_electron/*.tar.gz

    - name: Publish Linux Packages to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist_electron/*.deb
          dist_electron/*.AppImage
          dist_electron/*.pacman
          dist_electron/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

