name: Build Linux Releases

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        chmod +x node_modules/.bin/vite
        chmod +x node_modules/.bin/electron-builder || true

    - name: Download Linux AI Binaries
      run: |
        mkdir -p electron/bin
        curl -L -o llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b4528/llama-b4528-bin-ubuntu-x64.zip || true
        unzip -o llama.zip -d electron/bin/ || true
        chmod +x electron/bin/* || true

    - name: Build Linux (DEB & AppImage)
      run: npm run build:linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QBrowse-Linux-Builds
        path: |
          dist_electron/*.deb
          dist_electron/*.AppImage
