name: Build Windows Releases (SignPath Signing)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Windows Installer (Unsigned Artifact)
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

    - name: Upload Windows Installer Artifact
      id: upload-unsigned-artifact
      uses: actions/upload-artifact@v4
      with:
        name: QBrowse-Windows-Installer
        path: dist_electron/*.exe

    # When your SignPath application is approved and you add secrets:
    # 1. SIGNPATH_API_TOKEN
    # 2. SIGNPATH_ORGANIZATION_ID
    # Uncomment the step below to enable automatic SignPath Foundation signing:
    #
    # - name: Submit signing request to SignPath Foundation
    #   if: env.SIGNPATH_API_TOKEN != ''
    #   uses: signpath/github-action-submit-signing-request@v2
    #   env:
    #     SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    #   with:
    #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
    #     organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
    #     project-slug: 'qbrowse'
    #     signing-policy-slug: 'release-signing'
    #     github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
    #     wait-for-completion: true
    #     output-artifact-directory: 'dist_electron/signed/'

    - name: Publish Windows Installer to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist_electron/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
