<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QBrowse</title>
  </head>
  <body>
    <div id="error-container" style="color: red; padding: 20px; font-family: monospace; z-index: 99999; position: absolute; background: black; display: none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var el = document.getElementById('error-container');
        if (el) {
          el.style.display = 'block';
          el.innerText = 'App Crashed: ' + message + '\n\n' + (error ? error.stack : '');
        }
      };
    </script>
    <style>
      @keyframes qPulse {
        0% { transform: scale(0.92); opacity: 0.85; }
        50% { transform: scale(1.03); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.95; }
      }
      @keyframes qAura {
        0% { transform: scale(0.92); opacity: 0.45; }
        50% { transform: scale(1.18); opacity: 0.8; }
        100% { transform: scale(1.05); opacity: 0.55; }
      }
    </style>
    <div id="root">
      <div id="initial-boot-splash" style="position: fixed; inset: 0; background: #07080a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; user-select: none;">
        <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(212,188,148,0.22) 0%, rgba(212,188,148,0.06) 45%, transparent 70%); pointer-events: none; animation: qAura 1.4s ease-in-out infinite alternate;"></div>
        <img src="/icon.png" alt="QBrowse" style="width: 104px; height: 104px; object-fit: contain; position: relative; z-index: 10; animation: qPulse 1.2s ease-in-out infinite alternate; will-change: transform, opacity;" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
